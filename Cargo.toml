[package]
name = "litelan"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "default_fonts"] }
reqwest = { version = "=0.12.15", default-features = false, features = ["blocking", "json"] }
serde_json = "1"
url = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
